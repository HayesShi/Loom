[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-graph"
version = "0.2.0"
description = "Graph compilation and adaptive rotary coupling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24", "scipy>=1.10", "numba>=0.59"]

[project.optional-dependencies]
test = ["pytest>=8"]
data = ["torch-geometric>=2.7", "pandas>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
